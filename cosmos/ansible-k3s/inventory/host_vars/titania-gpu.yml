---
# Intel Arc Pro B60 AI inference and LLM proxy worker.
intel_gpu_monitoring_enabled: true
intel_graphics_ppa: "ppa:kobuk-team/intel-graphics"
xpu_smi_packages:
  - name: "libxpum2_2.0.0-238.26.04_amd64.deb"
    url: "https://github.com/intel/xpumanager/releases/download/v2.0.0/libxpum2_2.0.0-238.26.04_amd64.deb"
    checksum: "sha256:5e810bb820c7bc081d7af0ef772439b5dc2b1a945bec8d00893d810f5354ed90"
  - name: "xpu-smi_2.0.0-238.26.04_amd64.deb"
    url: "https://github.com/intel/xpumanager/releases/download/v2.0.0/xpu-smi_2.0.0-238.26.04_amd64.deb"
    checksum: "sha256:05bce5ea480e6167a94cca51d26b5a587b18f3d6e215d7b7206da5f9b556a374"

k3s_node_labels:
  - "kserve/localmodel=worker"
  - "workload=ai"
  - "inference=gpu"
  - "gpu.intel.com/product=arc-pro-b60"

k3s_node_taints:
  - "workload=ai:NoSchedule"

# Reserve 2 GiB of the 24 GiB guest for the OS and K3s, then evict workloads
# before memory pressure can kill containerd or k3s-agent. These values were
# derived from stable-node measurements: ~1.68 GiB system.slice and ~466 MiB
# k3s-agent memory, with no sustained PSI pressure.
k3s_extra_kubelet_args:
  - "system-reserved=memory=1280Mi"
  - "kube-reserved=memory=768Mi"
  - "eviction-soft=memory.available<1536Mi"
  - "eviction-soft-grace-period=memory.available=30s"
  - "eviction-hard=memory.available<1024Mi"
