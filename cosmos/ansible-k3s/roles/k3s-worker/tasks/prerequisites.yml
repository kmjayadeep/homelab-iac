---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install required system packages
  ansible.builtin.apt:
    name:
      - curl
      - git
      - vim
      - nfs-common
      - iptables
      - ca-certificates
      - open-iscsi
    state: present

- name: Configure Intel graphics package repository
  ansible.builtin.apt_repository:
    repo: "{{ intel_graphics_ppa }}"
    state: present
    update_cache: true
  when: intel_gpu_monitoring_enabled | default(false)

- name: Download Intel XPU-SMI packages
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "/var/tmp/{{ item.name }}"
    checksum: "{{ item.checksum }}"
    mode: '0644'
  loop: "{{ xpu_smi_packages }}"
  when: intel_gpu_monitoring_enabled | default(false)

- name: Install Intel XPU-SMI packages
  ansible.builtin.apt:
    deb: "/var/tmp/{{ item.name }}"
    state: present
    allow_downgrade: true
  loop: "{{ xpu_smi_packages }}"
  when: intel_gpu_monitoring_enabled | default(false)

- name: Verify Intel XPU-SMI detects the GPU
  ansible.builtin.command: xpu-smi discovery
  changed_when: false
  when: intel_gpu_monitoring_enabled | default(false)

- name: Load kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop: "{{ kernel_modules }}"

- name: Set sysctl parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: yes
    reload: yes
  loop: "{{ sysctl_settings | dict2items }}"

- name: Ensure cosmos user exists
  ansible.builtin.user:
    name: "{{ k3s_user }}"
    home: "/home/{{ k3s_user }}"
    shell: /bin/bash
    state: present

- name: Create model directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: '1000'
    group: '1000'
    mode: '0770'
  loop:
    - /models
    - /models/models

- name: Ensure model cache contents are writable by KServe jobs
  ansible.builtin.file:
    path: /models/models
    owner: '1000'
    group: '1000'
    recurse: true

- name: Enable and start rpcbind for NFS
  ansible.builtin.systemd:
    name: rpcbind
    enabled: yes
    state: started

