---
- name: Update K3s agents
  hosts: k3s_workers
  become: true
  serial: 1

  tasks:
    - name: Stop K3s agent service
      ansible.builtin.systemd:
        name: k3s-agent
        state: stopped

    - name: Download K3s binary
      ansible.builtin.get_url:
        url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s"
        dest: /usr/local/bin/k3s
        mode: '0755'
        owner: root
        group: root
        force: yes
      register: k3s_update

    - name: Display update result
      ansible.builtin.debug:
        msg: "K3s agent binary updated to {{ k3s_version }}"
      when: k3s_update.changed

    - name: Start K3s agent service
      ansible.builtin.systemd:
        name: k3s-agent
        state: started

    - name: Wait for the kubelet to listen
      ansible.builtin.wait_for:
        port: 10250
        delay: 10
        timeout: 180
