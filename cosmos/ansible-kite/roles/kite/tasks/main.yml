---
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ kite_base_packages }}"
    state: present
    update_cache: true

- name: Ensure Kite group exists
  ansible.builtin.group:
    name: "{{ kite_group }}"
    state: present

- name: Ensure Kite user exists
  ansible.builtin.user:
    name: "{{ kite_user }}"
    group: "{{ kite_group }}"
    shell: /bin/bash
    create_home: true

- name: Install SSH authorized keys for Kite user
  ansible.posix.authorized_key:
    user: "{{ kite_user }}"
    key: "{{ item }}"
    state: present
  loop: "{{ kite_authorized_keys }}"

- name: Configure git user name for Kite
  ansible.builtin.git_config:
    name: user.name
    scope: global
    value: "{{ kite_git_user_name }}"
  become_user: "{{ kite_user }}"

- name: Configure git user email for Kite
  ansible.builtin.git_config:
    name: user.email
    scope: global
    value: "{{ kite_git_user_email }}"
  become_user: "{{ kite_user }}"

- name: Disable default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Configure Nginx proxy for Kite
  ansible.builtin.template:
    src: kite-nginx.conf.j2
    dest: /etc/nginx/sites-available/kite.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable Kite Nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/kite.conf
    dest: /etc/nginx/sites-enabled/kite.conf
    state: link
  notify: Reload nginx

- name: Ensure Nginx is running
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true

- name: Show next steps
  ansible.builtin.debug:
    msg:
      - "Kite VM base configuration is complete."
      - "Nginx proxies http://{{ kite_domain }} to http://{{ kite_upstream_host }}:{{ kite_upstream_port }}."
      - "No application software was installed."
      - "Connect with: ssh {{ kite_user }}@{{ ansible_host }}"
