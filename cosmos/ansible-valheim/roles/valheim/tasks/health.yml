---
- name: Wait for Valheim service to be active
  ansible.builtin.command: systemctl is-active --quiet valheim
  register: valheim_service_health
  changed_when: false
  retries: 12
  delay: 5
  until: valheim_service_health.rc == 0

- name: Wait for Valheim server process
  ansible.builtin.command: pgrep -f "{{ valheim_install_dir }}/valheim_server.x86_64"
  register: valheim_process_health
  changed_when: false
  retries: 12
  delay: 5
  until: valheim_process_health.rc == 0

- name: Wait for Valheim UDP socket
  ansible.builtin.shell: >-
    set -o pipefail &&
    ss -H -l -u -n |
    grep -Eq ':{{ valheim_server_port }}([[:space:]]|$)|:{{ valheim_server_port + 1 }}([[:space:]]|$)'
  args:
    executable: /bin/bash
  register: valheim_socket_health
  changed_when: false
  retries: 24
  delay: 5
  until: valheim_socket_health.rc == 0

- name: Read current Valheim service activation time
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - valheim
      - --property=ActiveEnterTimestamp
      - --value
  register: valheim_active_since
  changed_when: false

- name: Wait for current Valheim process connection-ready log message
  ansible.builtin.command:
    argv:
      - journalctl
      - -u
      - valheim
      - --since
      - "{{ valheim_active_since.stdout }}"
      - --no-pager
  register: valheim_log_health
  changed_when: false
  retries: 24
  delay: 5
  until: "'Game server connected' in valheim_log_health.stdout"

- name: Confirm Valheim service did not restart during readiness checks
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - valheim
      - --property=ActiveEnterTimestamp
      - --value
  register: valheim_active_after_health
  changed_when: false
  failed_when: valheim_active_after_health.stdout != valheim_active_since.stdout
