---
- name: Require host-specific Valheim credentials
  ansible.builtin.assert:
    that:
      - valheim_server_password is defined
      - valheim_server_password | length >= 5
      - (not (valheim_crossplay | bool)) or (valheim_instance_id | length > 0)
    fail_msg: >-
      Define valheim_server_password in the encrypted host vault and set a
      unique valheim_instance_id when crossplay is enabled.
  no_log: true

- name: Include prerequisite tasks
  include_tasks: prerequisites.yml

- name: Include Tailscale setup tasks
  ansible.builtin.include_tasks: tailscale.yml
  when: tailscale_enabled | default(false) | bool

- name: Include SteamCMD installation tasks
  include_tasks: steamcmd.yml

- name: Include Valheim server setup tasks
  include_tasks: valheim.yml

- name: Include systemd service tasks
  include_tasks: systemd-fast.yml

- name: Include world download server tasks
  ansible.builtin.include_tasks: world-download.yml
  when: world_download_enabled | default(false) | bool

- name: Include firewall configuration tasks
  include_tasks: firewall.yml

- name: Include backup configuration tasks
  include_tasks: backup.yml
  when: backup_enabled | default(false)

