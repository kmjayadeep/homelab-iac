---
- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Remove unrestricted Valheim server ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: udp
    delete: true
  loop:
    - "{{ valheim_server_port }}"
    - "{{ valheim_server_port + 1 }}"
  when: valheim_game_interface | default('') | length > 0

- name: Allow Valheim server ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: udp
    interface_in: "{{ valheim_game_interface | default(omit, true) }}"
  loop:
    - "{{ valheim_server_port }}"
    - "{{ valheim_server_port + 1 }}"

- name: Reload UFW
  community.general.ufw:
    state: reloaded
