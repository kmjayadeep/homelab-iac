---
- name: Create Valheim directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ steam_user }}"
    group: "{{ steam_group }}"
    mode: '0755'
  loop:
    - "{{ valheim_install_dir }}"
    - "{{ valheim_data_dir }}"

- name: Install/Update Valheim Dedicated Server
  ansible.builtin.command:
    cmd: >
      {{ steamcmd_dir }}/steamcmd.sh
      +force_install_dir {{ valheim_install_dir }}
      +login anonymous
      +app_update {{ valheim_app_id }} validate
      +quit
  become_user: "{{ steam_user }}"
  register: valheim_install
  changed_when: "'Success! App' in valheim_install.stdout"

- name: Create Valheim start script
  ansible.builtin.template:
    src: start_valheim.sh.j2
    dest: "{{ valheim_install_dir }}/start_valheim.sh"
    owner: "{{ steam_user }}"
    group: "{{ steam_group }}"
    mode: '0700'
  no_log: true
  diff: false

- name: Configure Valheim administrators
  ansible.builtin.template:
    src: platform-list.txt.j2
    dest: "{{ valheim_data_dir }}/adminlist.txt"
    owner: "{{ steam_user }}"
    group: "{{ steam_group }}"
    mode: '0644'
  vars:
    valheim_platform_ids: "{{ valheim_admin_ids | default([]) }}"

- name: Configure Valheim permitted players
  ansible.builtin.template:
    src: platform-list.txt.j2
    dest: "{{ valheim_data_dir }}/permittedlist.txt"
    owner: "{{ steam_user }}"
    group: "{{ steam_group }}"
    mode: '0644'
  vars:
    valheim_platform_ids: "{{ valheim_permitted_ids | default([]) }}"
  when: valheim_permitted_list_enabled | bool

- name: Disable the Valheim permitted-player list
  ansible.builtin.file:
    path: "{{ valheim_data_dir }}/permittedlist.txt"
    state: absent
  when: not valheim_permitted_list_enabled | bool

- name: Set proper permissions for Valheim server files
  ansible.builtin.file:
    path: "{{ valheim_install_dir }}"
    owner: "{{ steam_user }}"
    group: "{{ steam_group }}"
    recurse: yes

- name: Display server information
  ansible.builtin.debug:
    msg:
      - "Valheim server installation complete!"
      - "Server Name: {{ valheim_server_name }}"
      - "World Name: {{ valheim_world_name }}"
      - "Server Port: {{ valheim_server_port }}"
      - "Installation Directory: {{ valheim_install_dir }}"
      - "Data Directory: {{ valheim_data_dir }}"
      - "Start with: sudo systemctl start valheim"
      - "Check logs with: sudo journalctl -u valheim -f"

