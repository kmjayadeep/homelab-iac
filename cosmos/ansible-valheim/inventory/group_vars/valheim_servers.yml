---
# Shared Valheim Server Configuration
# Temporary legacy fallback; remove after both legacy host vaults are rotated.
valheim_server_password: "12345"

# Names, networking mode, and gameplay settings belong in host_vars.
valheim_server_port: 2456
valheim_public: 1
valheim_crossplay: false
valheim_instance_id: ""
valheim_preset: ""
valheim_modifiers:
  - "-modifier deathpenalty casual"
  - "-modifier combat hard"
  - "-modifier resources most"
  - "-setkey StaminaRate 50"
valheim_admin_ids: []
valheim_permitted_list_enabled: false
valheim_permitted_ids: []
tailscale_enabled: false
tailscale_accept_dns: false
valheim_game_interface: ""
world_download_enabled: false
world_download_port: 8000
world_download_interface: ""

# Installation paths
valheim_install_dir: "/home/valheim/valheim-server"
valheim_data_dir: "/home/valheim/.config/unity3d/IronGate/Valheim"
steamcmd_dir: "/home/valheim/steamcmd"

# SteamCMD settings
valheim_app_id: "896660"  # Valheim Dedicated Server App ID
steam_user: "valheim"
steam_group: "valheim"
steam_home: "/home/valheim"
valheim_authorized_keys:
  - "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_rsa.pub') }}"

# Server mods are opt-in per host.
valheim_mods_enabled: false

# Backup Configuration
backup_enabled: true
backup_schedule: "hourly"  # hourly, daily, etc.
backup_retention:
  keep_last: 10
  keep_daily: 10
  keep_monthly: 12

# Restic configuration variables will be loaded from vault.yaml
# The vault variables (restic_repository, restic_password, etc.) are automatically available

# Paths to backup
backup_paths:
  - "{{ valheim_data_dir }}/worlds_local"
