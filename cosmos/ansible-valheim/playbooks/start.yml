---
- name: Start Valheim Server
  hosts: valheim_servers
  become: true

  pre_tasks:
    - name: Require an explicit single-host limit
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_play_hosts_all | length == 1
        fail_msg: "Run this playbook with --limit <hostname>."
      run_once: true

  tasks:
    - name: Start Valheim service
      ansible.builtin.systemd:
        name: valheim
        state: started

    - name: Verify Valheim server health
      ansible.builtin.include_role:
        name: valheim
        tasks_from: health
