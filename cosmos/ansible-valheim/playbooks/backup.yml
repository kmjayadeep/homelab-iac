---
- name: Valheim Backup Operations
  hosts: valheim_servers
  become: true
  vars_prompt:
    - name: backup_operation
      prompt: "Choose backup operation (setup|backup|restore-test|list)"
      default: "backup"
      private: false

  pre_tasks:
    - name: Require an explicit single-host limit
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_play_hosts_all | length == 1
        fail_msg: "Run this playbook with --limit <hostname>."
      run_once: true

    - name: Verify backup is enabled
      ansible.builtin.assert:
        that: backup_enabled | default(false) | bool
        fail_msg: "Backup is not enabled for this host."

    - name: Validate backup operation
      ansible.builtin.assert:
        that: backup_operation in ['setup', 'backup', 'restore-test', 'list']
        fail_msg: "Choose setup, backup, restore-test, or list."

  tasks:
    - name: Configure backup services
      ansible.builtin.include_role:
        name: valheim
        tasks_from: backup
      when: backup_operation == 'setup'

    - name: Perform manual backup
      when: backup_operation == 'backup'
      block:
        - name: Run backup service and wait for completion
          ansible.builtin.systemd:
            name: backup-valheim.service
            state: started

        - name: Read backup logs
          ansible.builtin.command: journalctl -u backup-valheim.service -n 100 --no-pager
          register: backup_logs
          changed_when: false

        - name: Display backup results
          ansible.builtin.debug:
            var: backup_logs.stdout_lines

    - name: List backup snapshots
      when: backup_operation == 'list'
      block:
        - name: Query restic snapshots
          ansible.builtin.shell: |
            set -o pipefail
            source /etc/restic-env
            restic snapshots
          args:
            executable: /bin/bash
          register: snapshots
          changed_when: false
          become_user: "{{ steam_user }}"

        - name: Display snapshots
          ansible.builtin.debug:
            var: snapshots.stdout_lines

    - name: Test restoring a backup
      when: backup_operation == 'restore-test'
      block:
        - name: Prompt for snapshot ID
          ansible.builtin.pause:
            prompt: "Enter a snapshot ID or latest"
          register: snapshot_choice
          when: backup_snapshot is not defined

        - name: Select snapshot for restore drill
          ansible.builtin.set_fact:
            selected_backup_snapshot: >-
              {{ backup_snapshot if backup_snapshot is defined else snapshot_choice.user_input }}

        - name: Validate snapshot ID
          ansible.builtin.assert:
            that: selected_backup_snapshot == 'latest' or selected_backup_snapshot is match('^[a-fA-F0-9]+$')
            fail_msg: "Snapshot ID must be a hexadecimal restic ID or latest."

        - name: Set isolated restore path
          ansible.builtin.set_fact:
            valheim_restore_path: "/tmp/valheim-restore-{{ ansible_facts.date_time.epoch }}"

        - name: Restore snapshot to the isolated path
          ansible.builtin.shell: |
            set -o pipefail
            source /etc/restic-env
            restic restore "{{ selected_backup_snapshot }}" --target "{{ valheim_restore_path }}"
          args:
            executable: /bin/bash
          become_user: "{{ steam_user }}"

        - name: Verify restored world directory
          ansible.builtin.stat:
            path: "{{ valheim_restore_path }}{{ valheim_data_dir }}/worlds_local"
          register: restored_worlds

        - name: Require restored world data
          ansible.builtin.assert:
            that:
              - restored_worlds.stat.exists
              - restored_worlds.stat.isdir
            fail_msg: "The restored snapshot does not contain worlds_local."

        - name: Display restore drill result
          ansible.builtin.debug:
            msg: >-
              Restore drill succeeded at {{ valheim_restore_path }}. Inspect it
              manually, then remove it without replacing the live world data.
