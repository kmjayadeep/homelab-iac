---
openclaw_domain: "openclaw-chinnu.cosmos.cboxlab.com"
openclaw_cert_domain: "{{ openclaw_domain }}"

restic_repository: "{{ lookup('env', 'OPENCLAW_CHINNU_RESTIC_REPOSITORY') | default('s3:https://minio.cosmos.cboxlab.com/openclaw-chinnu-backup', true) }}"
restic_password: "{{ lookup('env', 'OPENCLAW_CHINNU_RESTIC_PASSWORD') }}"
restic_s3_access_key: "{{ lookup('env', 'OPENCLAW_CHINNU_RESTIC_S3_ACCESS_KEY') }}"
restic_s3_secret_key: "{{ lookup('env', 'OPENCLAW_CHINNU_RESTIC_S3_SECRET_KEY') }}"
uptimekuma_url: "{{ lookup('env', 'OPENCLAW_CHINNU_UPTIMEKUMA_URL') | default('', true) }}"
